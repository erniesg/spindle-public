name: Repository checks

# Repository Actions remain disabled until the owner approves enabling them.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install pinned development compiler (no install scripts)
        run: npm ci --ignore-scripts
      - name: Check shared behavior and package boundary (not native acceptance)
        run: make check
